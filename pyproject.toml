[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurinferno"
version = "0.1.0"
description = "Field-boundary inference for unlabeled binary protocol messages."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "NeurInferno authors" }]
keywords = ["protocol", "reverse-engineering", "binary", "transformer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "einops>=0.7",
  "numpy>=1.24",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = [
  "pytorch-lightning>=2.1",
  "gdown>=5.0",
]
demo = [
  "gradio>=5.29",
]

[project.urls]
Homepage = "https://github.com/Sachithx/NeurInferno"
HuggingFace = "https://huggingface.co/sachithabey/neurinferno"
Dataset = "https://huggingface.co/datasets/sachithabey/neurinferno"
Space = "https://huggingface.co/spaces/sachithabey/neurinferno"

[project.scripts]
neurinferno = "neurinferno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
