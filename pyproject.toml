[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurinferno"
version = "0.2.0"
description = "Field-boundary inference for unlabeled binary protocol messages."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "NeurInferno authors" }]
keywords = ["protocol", "reverse-engineering", "binary", "transformer", "field-boundary"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "einops>=0.7",
  "numpy>=1.24",
  "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = [
  "pytorch-lightning>=2.1",
  "gdown>=5.0",
]
demo = [
  "gradio>=5.29,<6",
]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.8",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/Sachithx/NeurInferno"
Source = "https://github.com/Sachithx/NeurInferno"
Issues = "https://github.com/Sachithx/NeurInferno/issues"
HuggingFace = "https://huggingface.co/sachithabey/neurinferno"
Dataset = "https://huggingface.co/datasets/sachithabey/neurinferno"
Space = "https://huggingface.co/spaces/sachithabey/neurinferno"

[project.scripts]
neurinferno = "neurinferno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurinferno = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["neurinferno"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "data",
  "checkpoints",
  "results",
  "hf_space/.staging",
  "hf_space/.dataset_staging",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["neurinferno"]
