name: Bug report
description: Report a reproducible problem in the package, CLI, or demo.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve NeurInferno. Remove sensitive packet contents before posting.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe input and exact command or Python snippet.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: NeurInferno version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, PyTorch version, and CPU/GPU.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and sensitive message data before pasting logs.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, and sensitive traffic from this report.
          required: true
